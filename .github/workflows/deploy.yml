name: Dugout Backend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃 소스코드
        uses: actions/checkout@v4

      - name: JDK 17 설정 (버전에 맞춰 수정)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 빌드 권한 부여
        run: chmod +x gradlew

      - name: Gradle로 빌드 실행
        run: ./gradlew clean build -x test

      - name: 프롬프트 파일 S3 업로드
        run: |
          aws s3 cp prompts/chat-sql-system.txt    s3://${{ secrets.S3_BUCKET_NAME }}/prompts/chat-sql-system.txt
          aws s3 cp prompts/chat-sql-fewshot.txt   s3://${{ secrets.S3_BUCKET_NAME }}/prompts/chat-sql-fewshot.txt
          aws s3 cp prompts/chat-answer-system.txt s3://${{ secrets.S3_BUCKET_NAME }}/prompts/chat-answer-system.txt
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast

      - name: 빌드된 JAR 파일을 EC2로 전송 (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/libs/*.jar,!build/libs/*-plain.jar"
          target: "/home/ubuntu/dugout/tars"
          strip_components: 2
          timeout: 10m
          command_timeout: 10m

      - name: EC2에서 서버 재시작 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            fuser -k 8080/tcp || true
            sleep 2
            rm -f /home/ubuntu/dugout/*.jar
            cp /home/ubuntu/dugout/tars/*.jar /home/ubuntu/dugout/app.jar
            nohup /usr/bin/java \
              -Xms128m \
              -Xmx400m \
              -XX:MaxMetaspaceSize=128m \
              -XX:+UseG1GC \
              -jar /home/ubuntu/dugout/app.jar \
              "--spring.datasource.url=${{ secrets.DB_URL }}" \
              "--spring.datasource.username=${{ secrets.DB_USERNAME }}" \
              "--spring.datasource.password=${{ secrets.DB_PASSWORD }}" \
              "--aws.athena.region=${{ secrets.AWS_ATHENA_REGION }}" \
              "--aws.athena.database=${{ secrets.AWS_ATHENA_DATABASE }}" \
              "--aws.athena.output-location=${{ secrets.AWS_ATHENA_OUTPUT_LOCATION }}" \
              "--naver.api.client-id=${{ secrets.NAVER_CLIENT_ID }}" \
              "--naver.api.client-secret=${{ secrets.NAVER_CLIENT_SECRET }}" \
              "--jwt.secret=${{ secrets.JWT_SECRET_KEY }}" \
              "--aws.s3.bucket=${{ secrets.S3_BUCKET_NAME }}" \
              "--aws.s3.master-bucket=${{ secrets.S3_MASTER_BUCKET_NAME }}" \
              "--aws.s3.master-key=${{ secrets.S3_MASTER_KEY }}" \
              "--aws.s3.pitcher-master-key=${{ secrets.S3_MASTER_PITCHER_KEY }}" \
              "--aws.s3.fa-batter-master-key=${{ secrets.S3_FA_BATTER_MASTER_KEY }}" \
              "--aws.s3.fa-pitcher-master-key=${{ secrets.S3_FA_PITCHER_MASTER_KEY }}" \
              "--aws.lambda.secret-key=${{ secrets.AWS_LAMBDA_SECRET_KEY }}" > /home/ubuntu/dugout/app.log 2>&1 &